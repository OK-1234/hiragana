<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ff">
  <title>ゆびで！ビーム — ちいさな宇宙のぼうけん</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="core.js"></script>
  <script defer src="game.js"></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <a class="brand" href="./" aria-label="ゆびで！ビーム ホーム"><span class="brand-icon">✦</span><span>ゆびで！<b>ビーム</b><small>ちいさな宇宙のぼうけん</small></span></a>
      <button id="sound" class="icon-button" aria-label="音をオンにする" aria-pressed="false"><span id="sound-icon">♪</span><span id="sound-label">おと OFF</span></button>
    </header>
    <div class="layout">
      <section class="game-card" aria-label="指でビームを出すゲーム">
        <div class="arena-top"><span class="world-label"><span class="tiny-planet">◒</span> ほしの ひろば</span><div id="steps" class="steps" aria-label="7つのあそび"></div></div>
        <div class="playfield">
          <div class="scene-caption"><span class="enemy-label">ぷにぷに モンスター</span><div id="barriers" class="barriers" aria-label="モンスターのバリア"></div></div>
          <svg id="arena" viewBox="0 0 360 465" role="application" aria-label="光る点を触って、光の道を指でたどろう">
            <defs>
              <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#eee9ff"/><stop offset="1" stop-color="#f9f6ff"/></linearGradient>
              <linearGradient id="jelly" x2="0.8" y2="1"><stop stop-color="#c5f883"/><stop offset="1" stop-color="#76d4a2"/></linearGradient>
              <linearGradient id="energy" x2="1" y2="0"><stop stop-color="#aa7bff"/><stop offset="1" stop-color="#7654f3"/></linearGradient>
              <radialGradient id="halo"><stop stop-color="#d3beff" stop-opacity=".7"/><stop offset="1" stop-color="#e7dbff" stop-opacity="0"/></radialGradient>
              <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
            </defs>
            <rect width="360" height="465" fill="url(#sky)"/>
            <g class="sky-art" fill="#b6a7e0"><path d="M43 57l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><path d="M303 164l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><circle cx="306" cy="50" r="2"/><circle cx="48" cy="168" r="2"/><circle cx="272" cy="27" r="2"/><circle cx="30" cy="270" r="2"/><path d="M316 282l2 4 4 2-4 2-2 4-2-4-4-2 4-2z"/></g>
            <g opacity=".55"><ellipse cx="49" cy="113" rx="16" ry="6" fill="none" stroke="#d3c3f5" stroke-width="3" transform="rotate(-25 49 113)"/><circle cx="49" cy="113" r="9" fill="#ddd1f7"/><circle cx="315" cy="109" r="7" fill="#ffd6b7"/></g>
            <ellipse cx="180" cy="185" rx="66" ry="10" fill="#d4c7ee" opacity=".45"/>
            <g id="enemy-wrap">
              <g id="shield"><ellipse cx="180" cy="112" rx="87" ry="78" fill="#fff" fill-opacity=".14" stroke="#baa4f2" stroke-width="2" stroke-dasharray="7 7"/><path d="M117 72Q126 55 143 50" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/></g>
              <g id="enemy">
                <path d="M143 69Q125 43 133 40Q149 39 157 64M204 64Q215 37 226 42Q234 48 217 73" fill="#9ee5a0" stroke="#66b894" stroke-width="2.5"/>
                <path d="M125 104Q109 76 94 91Q83 109 111 127M239 101Q259 83 266 99Q271 117 246 128" fill="#94dfa1" stroke="#66b894" stroke-width="2.5"/>
                <path d="M115 110C115 50 245 50 245 110L251 144Q254 163 233 167Q216 170 208 160Q196 177 180 162Q164 177 150 161Q125 177 112 159Q102 149 115 110Z" fill="url(#jelly)" stroke="#66b894" stroke-width="2.5"/>
                <ellipse cx="151" cy="88" rx="17" ry="7" fill="#edffc3" opacity=".8" transform="rotate(-20 151 88)"/>
                <g id="face"><ellipse cx="152" cy="115" rx="7" ry="10" fill="#345766"/><ellipse cx="209" cy="115" rx="7" ry="10" fill="#345766"/><circle cx="154" cy="112" r="2.5" fill="white"/><circle cx="211" cy="112" r="2.5" fill="white"/><path d="M172 130Q180 139 189 130" fill="none" stroke="#345766" stroke-width="3" stroke-linecap="round"/></g>
                <ellipse cx="137" cy="132" rx="10" ry="5" fill="#f4a9ae" opacity=".75"/><ellipse cx="226" cy="132" rx="10" ry="5" fill="#f4a9ae" opacity=".75"/>
                <path d="M179 80l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" fill="#faffda"/>
              </g>
            </g>
            <text id="cue" x="180" y="223" text-anchor="middle">ぴかっ！を タッチ</text>
            <g id="trail">
              <path id="rail-shadow" fill="none" stroke="#d9cfed" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
              <path id="rail" fill="none" stroke="#fff" stroke-width="43" stroke-linecap="round" stroke-linejoin="round"/>
              <path id="guide" fill="none" stroke="#d3bff3" stroke-width="4" stroke-dasharray="1 12" stroke-linecap="round"/>
              <path id="charged-glow" fill="none" stroke="#ae8cff" stroke-width="26" stroke-linecap="round" opacity=".3"/>
              <path id="charged" fill="none" stroke="url(#energy)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
              <g id="finish"><circle r="19" fill="#f0e9ff" stroke="#c3afe9" stroke-width="2"/><path d="M-6-1L-1 5 8-6" fill="none" stroke="#a48acb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
              <g id="start"><circle class="start-halo" r="40" fill="#b59aff" opacity=".2"/><circle r="29" fill="#8760e8" stroke="white" stroke-width="5"/><circle r="19" fill="#a27cf3"/><path d="M0-12L3-4 12 0 3 4 0 12-3 4-12 0-3-4z" fill="white"/></g>
              <g id="hint" pointer-events="none"><circle r="16" fill="#fff" opacity=".8"/><circle r="9" fill="#c4a5ff"/><circle r="4" fill="white"/></g>
              <circle id="finger" r="14" fill="#fff" stroke="#aa81ff" stroke-width="5" visibility="hidden"/>
            </g>
            <g id="effects" pointer-events="none"></g>
            <g class="ground" pointer-events="none"><path d="M0 447Q90 421 182 445T360 442V465H0Z" fill="#e8dff7"/><path d="M0 458Q99 438 196 458T360 452V465H0Z" fill="#dfd4f0"/><path d="M35 449l-4-10M36 449l6-6M320 447l-2-11M321 447l6-6" stroke="#c5b6e0" stroke-width="3" stroke-linecap="round"/></g>
          </svg>
          <div id="toast" class="toast" aria-live="polite"></div>
          <div id="victory" class="victory" hidden><div class="victory-stars">✦ ★ ✦</div><h1>やったー！</h1><p>モンスターと なかよし！</p><button id="replay">もういっかい <span>↻</span></button></div>
        </div>
        <footer class="game-footer"><span class="spark">✧</span><span id="footer-cue">ひかる ほしに さわってみよう</span><span class="footer-stars">✦ · ✧</span></footer>
      </section>
      <aside class="chat-card" aria-label="架空のキャラクターの応援チャット"><div class="chat-heading"><span><i></i> おうえん ひろば</span><span class="chat-symbol">♧</span></div><div id="chat" class="chat" aria-live="off"></div><div class="chat-note">どうぶつたちが おうえんちゅう <span>♡</span><small>ゲーム内の架空のコメントです</small></div></aside>
    </div>
    <footer class="page-footer"><span>ちいさな ゆびから、おおきな ぼうけん。</span><button id="debug-toggle">保護者・開発用</button></footer>
    <section id="debug" class="debug" hidden><h2>操作の記録（このプレイ中のみ）</h2><p>操作の事実を記録します。発達や能力の診断ではありません。画面を閉じると消えます。</p><button id="export">JSONをダウンロード</button><pre id="debug-output"></pre></section>
  </main>
</body>
</html>
